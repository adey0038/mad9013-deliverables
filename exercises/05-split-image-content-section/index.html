<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>05 - Split Image Content Section</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/custom.css" />
  </head>
  <body>
    <section class="image-content">
      <div class="container">
        <div class="image-content__image">
          <img src="./images/dock.jpg" alt="A nice dock on the lake" />
        </div>

        <div class="image-content__content">
          <h2 class="image-content__title">Heading 2</h2>
          <p class="image-content__text">
            Lorem ipsum dolor sit, amet consectetur adipisicing elit.
            Repellendus, earum hic nulla voluptates quia sit cupiditate illum,
            odio dolorem, iusto labore? Suscipit eligendi quam perferendis
            molestiae, eius animi non itaque!
          </p>
          <a href="#" class="btn">Learn More</a>
        </div>
      </div>
    </section>
  </body>
</html>
