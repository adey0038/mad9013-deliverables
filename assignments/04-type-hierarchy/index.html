<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type Hierarchy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="./css/main.css" rel="stylesheet"/>
    <link href="./css/custom.css" rel="stylesheet"/>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="heading--main">Heading 1</h1>
            <h2 class="heading--secondary">Heading 2</h2>
        </header>
        <main>
            <section class="headings">
                <h3 class="heading--three">Heading 3</h3>
                <h4 class="heading--four">Heading 4</h4>
                <h5 class="heading--five">Heading 5</h5>
            </section>
            <section class="detail">
                <h6 class="heading--six">Heading 6</h6>
                <p class="paragraph">Lorem ipsum dolor, sit amet <a href="#">consectetur adipisicing</a>
                    elit. Architecto eum delectus cumque! Nulla iure nemo officiis, 
                    dolor harum eligendi praesentium, suscipit ullam molestiae distinctio labore, mollitia magnam beatae laboriosam vel.</p>
            </section>
        </main>
    </div>
</body>
</html>
