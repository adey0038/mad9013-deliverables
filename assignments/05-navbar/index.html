<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nav Bar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/custom.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <a href="/" class="header__logo">
          <img
            src="./images/madd-logo.svg"
            alt="MADD Logo"
            class="header__icon"
          />
          <span class="header__title">MAD9013</span>
        </a>

        <nav class="header__nav">
          <ul class="header__list">
            <li><a href="#" class="header__link">Nav Link 1</a></li>
            <li><a href="#" class="header__link">Nav Link 2</a></li>
            <li><a href="#" class="header__link">Nav Link 3</a></li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
